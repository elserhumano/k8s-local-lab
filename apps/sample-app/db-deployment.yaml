apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-db
  namespace: sample-app
  labels:
    app: sample-app
    tier: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-app
      tier: db
  template:
    metadata:
      labels:
        app: sample-app
        tier: db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine # Light and secure image choice
          ports:
            - containerPort: 5432
              name: dbport
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: db.name
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: db.password
---
apiVersion: v1
kind: Service
metadata:
  name: sample-db-service
  namespace: sample-app
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: sample-app
    tier: db

