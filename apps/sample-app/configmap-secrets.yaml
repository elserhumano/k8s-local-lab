---
# configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: sample-app
data:
  db.name: "architect_db"
  environment: "local-lab"
---
# secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: sample-app
type: Opaque
stringData:
  # In production, use external secret managers (e.g., Vault, AWS Secrets Manager)
  db.password: "SuperSecureDevOpsPass123!"
