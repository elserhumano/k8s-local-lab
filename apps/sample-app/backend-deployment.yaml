---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-backend
  namespace: sample-app
  labels:
    app: sample-app
    tier: backend
spec:
  replicas: 2 #Demonstrating high availability and horizontal scaling
  selector:
    matchLabels:
      app: sample-app
      tier: backend
  template:
    metadata:
      labels:
        app: sample-app
        tier: backend
    spec:
      containers:
        - name: api
          #Swapped to a stable, lightweight web server to prevent Docker socket panic loops
          image: nginx:1.27-alpine 
          ports:
            - containerPort: 80 #Nginx default port
              name: http
          env:
            - name: DB_HOST
              value: "sample-db-service"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: db.password
---
apiVersion: v1
kind: Service
metadata:
  name: sample-backend-service
  namespace: sample-app
spec:
  ports:
    - port: 8080
      targetPort: 80 #Routes service port 8080 into container port 80
  selector:
    app: sample-app
    tier: backend
