apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-backend
  namespace: sample-app
  labels:
    app: sample-app
    tier: backend
spec:
  replicas: 2 # Demonstrating high availability and horizontal scaling
  selector:
    matchLabels:
      app: sample-app
      tier: backend
  template:
    metadata:
      labels:
        app: sample-app
        tier: backend
    spec:
      containers:
        - name: api
          image: testcontainers/ryuk:0.8.1 # Standard lightweight container mockup for connectivity tests
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: "sample-db-service"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: db.password
---
apiVersion: v1
kind: Service
metadata:
  name: sample-backend-service
  namespace: sample-app
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: sample-app
    tier: backend

